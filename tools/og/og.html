<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<!--
  תבנית נכס השיתוף (1200×630).
  נבנית מאותם טוקנים וגופנים של האתר, כדי שתצוגת הקישור בוואטסאפ ובפייסבוק
  תהיה המשך של העמוד ולא נכס נפרד. מרונדרת לתמונה על ידי tools/og/build-og.mjs.
  זהו המסך הראשון שהקהל המופנה רואה — לפני ההירו.
-->
<link rel="stylesheet" href="../../assets/css/style.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    inline-size: 1200px;
    block-size: 630px;
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    align-items: stretch;
    background: var(--bone);
    box-sizing: border-box;
    overflow: hidden;
  }
  .og__text {
    padding: 64px 68px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    border-inline-end: 1px solid var(--rule);
  }
  .og__brand {
    font-family: var(--f-body);
    font-size: 19px;
    font-weight: 700;
    color: var(--ink-3);
    margin: 0 0 22px;
  }
  .og__title {
    font-family: var(--f-display);
    font-size: 92px;
    line-height: 0.92;
    color: var(--ink);
    margin: 0 0 26px;
  }
  .og__sub {
    font-family: var(--f-body);
    font-size: 23px;
    line-height: 1.5;
    color: var(--ink-2);
    margin: 0;
    max-width: 26ch;
  }
  .og__rule {
    display: flex; align-items: center; gap: 12px;
    margin-block-start: 30px;
    font-family: var(--f-body); font-weight: 700; font-size: 19px; color: var(--signal);
  }
  .og__rule::before { content: ""; inline-size: 36px; block-size: 3px; background: currentColor; }
  .og__img { position: relative; }
  .og__img img {
    inline-size: 100%; block-size: 100%; object-fit: cover; display: block;
    filter: saturate(1.18) contrast(1.08) brightness(1.02);
  }
</style>
</head>
<body>
  <div class="og__text">
    <p class="og__brand">בני לפקוביץ · תכנון נקודות מכירה</p>
    <h1 class="og__title">מתכננים את החנות נכון.<br>מוכרים יותר.</h1>
    <p class="og__sub">תכנון ואופטימיזציה לנקודות מכירה</p>
    <p class="og__rule">22 שנות ניסיון קמעונאי</p>
  </div>
  <div class="og__img"><img src="../../assets/img/store-produce.jpg" alt=""></div>
</body>
</html>
