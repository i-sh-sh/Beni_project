<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<!--
  תבנית נכס השיתוף (1200×630).
  נבנית מאותם טוקנים וגופנים של האתר, כדי שתצוגת הקישור בוואטסאפ ובפייסבוק
  תהיה המשך של העמוד ולא נכס נפרד. מרונדרת לתמונה על ידי tools/og/build-og.mjs.
  זהו המסך הראשון שהקהל המופנה רואה — לפני ההירו.
-->
<link rel="stylesheet" href="../../assets/css/style.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    inline-size: 1200px;
    block-size: 630px;
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    align-items: stretch;
    background: var(--brand-500);
    box-sizing: border-box;
    overflow: hidden;
  }
  /* צד הטקסט הוא השדה הכחול של ההירו. הוא נושא אך ורק טקסט תצוגה
     והסימן: לבן על #0082FC הוא 3.75:1, שעובר רק לטקסט גדול. */
  .og__text {
    padding: 58px 64px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 26px;
  }
  .og__mark { inline-size: 104px; block-size: auto; }
  .og__brand {
    align-self: flex-start;
    font-family: var(--f-body);
    font-size: 20px;
    font-weight: 700;
    color: var(--brand-600);
    background: #fff;
    border-radius: 999px;
    padding: 8px 20px;
    margin: 0;
  }
  .og__title {
    font-family: var(--f-display);
    font-weight: 800;
    font-size: 70px;
    line-height: 1.0;
    color: #fff;
    margin: 0;
  }
  .og__img { position: relative; }
  .og__img img {
    inline-size: 100%; block-size: 100%; object-fit: cover; display: block;
    filter: saturate(1.18) contrast(1.08) brightness(1.02);
  }
</style>
</head>
<body>
  <div class="og__text">
    <img class="og__mark" src="../../assets/img/logo-mark.svg" alt="">
    <p class="og__brand">בני לפקוביץ · תכנון נקודות מכירה</p>
    <h1 class="og__title">מתכננים את החנות נכון.<br>מוכרים יותר.</h1>
  </div>
  <div class="og__img"><img src="../../assets/img/store-produce.jpg" alt=""></div>
</body>
</html>
